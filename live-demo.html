      if (key !== null) {

          alert("API key saved securely in your browser's private storage.");
        } else {

    // Fast Groq executor with instant 1.2s timeout
    async function requestGroqCompletion(messages) {
      if (!GROQ_API_KEY) return null; // Uses instant smart built-in engine if no key is configured
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1200);

        const res = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://api.groq.com/openai/v1/chat/completions"), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: messages,
            temperature: 0.65,
            max_tokens: 380
          }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data.choices && data.choices[0]?.message?.content) {
            return data.choices[0].message.content;
          }
        }
      } catch (_) {
        // Fast instant fallback to local conversational engine
      }
      return null;
    }

    // Comprehensive real estate conversational AI engine
    function getSmartOfflineReply(rawUserText) {
      let t = rawUserText.toLowerCase()
        .replace(/shoe/g, 'show')

        .replace(/huse|hosue|hous\b/g, 'house')
        .replace(/bedromms|bedroms|bedrom|bdrm|brooms|bed rooms|bedrooms/g, 'bedroom')
        .replace(/\btwo\b/g, '2')
        .replace(/\bthree\b/g, '3')
        .replace(/\bfour\b/g, '4')
        .replace(/\bone\b/g, '1')
        .replace(/\bfive\b/g, '5');

      // A. Explicit Media / Photo Gallery Request
      const wantsMedia = t.includes('picture') || t.includes('photo') || t.includes('gallery') || t.includes('inside') || t.includes('images');

      // B. Mortgage & EMI Calculation Handler (Calculates exact EMI for any property or custom price)
      const wantsMortgage = t.includes('emi') || t.includes('mortgage') || t.includes('calculate') || t.includes('monthly payment') || t.includes('loan payment') || t.includes('financing');
      if (wantsMortgage) {

    async function handleSendMessage(e) {
      if (e) e.preventDefault();
      const indicator = document.getElementById('typing-indicator');
      try {
        const input = document.getElementById('user-input');
        const userText = input.value.trim();
        if (!userText) return;

        input.value = '';
        const quickRepliesEl = document.getElementById('quick-replies');
        if (quickRepliesEl) quickRepliesEl.style.display = 'none';

        appendUserMessage(userText);
        conversationHistory.push({ role: 'user', content: userText });

        if (indicator) indicator.classList.remove('hidden');

        // Request completion from Groq or smart fallback
        let rawReply = await requestGroqCompletion(conversationHistory);
        if (!rawReply) {
          rawReply = getSmartOfflineReply(userText);
        }

        if (indicator) indicator.classList.add('hidden');

        const formattedReply = cleanFormat(rawReply);
        conversationHistory.push({ role: 'assistant', content: rawReply });

        // Live word-by-word streaming ticker effect
        const streamBubble = createStreamingAssistantBubble();
        const words = formattedReply.split(' ');
        let currentText = '';

        for (let i = 0; i < words.length; i++) {
          currentText += (i === 0 ? '' : ' ') + words[i];
          streamBubble.innerHTML = currentText;
          const container = document.getElementById('messages-container');
          container.scrollTop = container.scrollHeight;
          await new Promise(r => setTimeout(r, 14));
        }

        streamBubble.classList.remove('cursor-blink');

        let normText = userText.toLowerCase()
          .replace(/shoe/g, 'show')
          .replace(/picturs|pic|pics|photos|images/g, 'pictures')
          .replace(/huse|hosue|hous\b/g, 'house')
          .replace(/bedromms|bedroms|bedrom|bdrm|brooms|bed rooms|bedrooms/g, 'bedroom')
          .replace(/\btwo\b/g, '2')
          .replace(/\bthree\b/g, '3')
          .replace(/\bfour\b/g, '4')
          .replace(/\bone\b/g, '1')
          .replace(/\bfive\b/g, '5');

        // Immediately track which property is referenced in user message
        if (normText.includes('azure') || normText.includes('lakeside')) {
          lastDiscussedProperty = PROPERTIES[1];
        } else if (normText.includes('crest')) {
          lastDiscussedProperty = PROPERTIES[0];
        } else if (normText.includes('marina') || normText.includes('ocean') || normText.includes('beach')) {
          lastDiscussedProperty = PROPERTIES[2];
        } else if (normText.includes('penthouse') || normText.includes('skyline')) {
          lastDiscussedProperty = PROPERTIES[3];
        } else if (normText.includes('oakwood') || normText.includes('villa')) {
          lastDiscussedProperty = PROPERTIES[4];
        } else if (normText.includes('sunrise')) {
          lastDiscussedProperty = PROPERTIES[5];
        } else if (normText.includes('palm')) {
          lastDiscussedProperty = PROPERTIES[6];
        } else if (normText.includes('metro heights') || normText.includes('studio')) {
          lastDiscussedProperty = PROPERTIES[7];
        }

        // Check for scheduling intent -> Show Google Calendar booking card
        const lowerReply = rawReply.toLowerCase();

        if (normText.includes('visit') || normText.includes('tour') || normText.includes('schedule') || normText.includes('viewing') || normText.includes('appointment') || lowerReply.includes('calendar')) {
          appendGoogleCalendarCard();
        }

        // Photo Gallery rendering (Clean & Fast - no broken video)
        const wantsMedia = normText.includes('picture') || normText.includes('photo') || normText.includes('gallery') || normText.includes('inside') || normText.includes('images');
        if (wantsMedia) {
          if (normText.includes('penthouse') || normText.includes('skyline')) {
            appendPropertyGalleryCard(PROPERTIES[3]);
          } else if (normText.includes('crest')) {
            appendPropertyGalleryCard(PROPERTIES[0]);
          } else if (normText.includes('azure') || normText.includes('lakeside')) {
            appendPropertyGalleryCard(PROPERTIES[1]);
          } else if (normText.includes('marina') || normText.includes('ocean') || normText.includes('beach')) {
            appendPropertyGalleryCard(PROPERTIES[2]);
          } else if (normText.includes('oakwood') || normText.includes('villa')) {
            appendPropertyGalleryCard(PROPERTIES[4]);
          } else if (normText.includes('sunrise')) {
            appendPropertyGalleryCard(PROPERTIES[5]);
          } else if (normText.includes('palm')) {
            appendPropertyGalleryCard(PROPERTIES[6]);
          } else if (normText.includes('metro heights') || normText.includes('studio')) {
            appendPropertyGalleryCard(PROPERTIES[7]);
          } else if (lastDiscussedProperty) {
            appendPropertyGalleryCard(lastDiscussedProperty);
          }
        }

        // EMI card calculation — dynamically calculates for the exact property or custom price
        const wantsEmi = normText.includes('emi') || normText.includes('mortgage') || normText.includes('calculate') || normText.includes('financing') || normText.includes('monthly payment') || normText.includes('loan payment');
        if (wantsEmi) {
          let targetProp = null;
          if (normText.includes('azure') || normText.includes('lakeside')) targetProp = PROPERTIES[1];
          else if (normText.includes('crest')) targetProp = PROPERTIES[0];
          else if (normText.includes('marina') || normText.includes('ocean') || normText.includes('beach')) targetProp = PROPERTIES[2];
          else if (normText.includes('penthouse') || normText.includes('skyline')) targetProp = PROPERTIES[3];
          else if (normText.includes('oakwood') || normText.includes('villa')) targetProp = PROPERTIES[4];
          else if (normText.includes('sunrise')) targetProp = PROPERTIES[5];
          else if (normText.includes('palm')) targetProp = PROPERTIES[6];
          else if (normText.includes('metro heights')) targetProp = PROPERTIES[7];
          else targetProp = lastDiscussedProperty || PROPERTIES[0];

          lastDiscussedProperty = targetProp;
          appendEmiCard(targetProp.priceNum, targetProp.title);
        }

        // Dynamic Property Card Rendering (when exploring listings):
        if (!wantsEmi && !wantsMedia) {
          const isTwoBed = normText.includes('2 bed') || normText.includes('2-bed') || normText.includes('2bed') || normText.includes('two bed') || normText.includes('2 bhk') || normText.includes('2bhk') || normText.includes('2 room') || normText.includes('2br') || normText.includes('2 br') || ((normText.includes('dont have') || normText.includes("don't have") || normText.includes('not have') || normText.includes('means u dont') || normText.includes("means you don't") || normText.includes('u dont have')) && (normText.includes('2') || normText.includes('two')));
          const isOneBed = normText.includes('1 bed') || normText.includes('1-bed') || normText.includes('1bed') || normText.includes('one bed') || normText.includes('studio') || normText.includes('1bhk') || normText.includes('1br');
          const isFourBed = normText.includes('4 bed') || normText.includes('4-bed') || normText.includes('four bed') || normText.includes('villa') || normText.includes('oakwood') || normText.includes('4bhk') || normText.includes('4br');
          const isThreeBed = normText.includes('3 bed') || normText.includes('3-bed') || normText.includes('3bed') || normText.includes('three bed') || normText.includes('3bhk') || normText.includes('3br');

          if (isTwoBed) {
            appendPropertyCards([PROPERTIES[5], PROPERTIES[6]]); // Sunrise Heights ($280K), Palm Grove ($195K)
          } else if (isOneBed) {
            appendPropertyCards([PROPERTIES[7]]); // Metro Heights ($145K)
          } else if (isFourBed) {
            appendPropertyCards([PROPERTIES[4]]); // Oakwood Villa ($1.2M)
          } else if (isThreeBed) {
            appendPropertyCards([PROPERTIES[0], PROPERTIES[1]]); // Crest ($450K), Azure ($520K)
          } else if ((normText.includes('400k') || normText.includes('400')) && (normText.includes('1m') || normText.includes('1 million') || normText.includes('1000k'))) {
            appendPropertyCards([PROPERTIES[0], PROPERTIES[1], PROPERTIES[2], PROPERTIES[3]]);
          } else if (normText.includes('400k') && normText.includes('800k')) {
            appendPropertyCards([PROPERTIES[0], PROPERTIES[1], PROPERTIES[2]]); // Crest ($450K), Azure ($520K), Marina ($720K)
          } else if (normText.includes('500k') || (normText.includes('1m') && !normText.includes('400k')) || normText.includes('above 500')) {
            appendPropertyCards([PROPERTIES[1], PROPERTIES[2], PROPERTIES[3]]); // Azure ($520K), Marina ($720K), Skyline ($850K)
          } else if (normText.includes('under 300') || normText.includes('below 300') || normText.includes('affordable')) {
            appendPropertyCards([PROPERTIES[5], PROPERTIES[6], PROPERTIES[7]]);
          } else if (normText.includes('crest') && !hasShownPropertyCards) {
            appendPropertyCards([PROPERTIES[0]]); // The Crest
            hasShownPropertyCards = true;
          } else if (normText.includes('azure') && !hasShownPropertyCards) {
            appendPropertyCards([PROPERTIES[1]]); // Azure Towers
            hasShownPropertyCards = true;
          } else if ((normText.includes('pictures') || normText.includes('show') || normText.includes('looking for a home') || normText.includes('featured')) && !hasShownPropertyCards) {
            appendPropertyCards([PROPERTIES[0], PROPERTIES[1]]);
            hasShownPropertyCards = true;
          }
        }
      } catch (err) {
        console.error("Chat error:", err);
        if (indicator) indicator.classList.add('hidden');
      }
    }
